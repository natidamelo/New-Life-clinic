# ==============================================================================
# 🌐 Nginx Reverse Proxy Configuration - Clinical Management System SaaS
# ==============================================================================
# File Location on Server: /etc/nginx/sites-available/clinic-cms
# To enable this site:
#    sudo ln -s /etc/nginx/sites-available/clinic-cms /etc/nginx/sites-enabled/
#    sudo nginx -t
#    sudo systemctl restart nginx
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name app.newlifeclinic.et; # Replace with your actual domain or subdomain

    # Redirect all HTTP traffic to HTTPS (uncomment after obtaining SSL certificate)
    # return 301 https://$host$request_uri;

    # Static Frontend Configuration (React App SPA)
    root /var/www/clinic-cms/frontend/dist; # Replace with the absolute path to your built frontend
    index index.html;

    # Support for React Router SPA (redirects all frontend routes to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxying
    # Forward all /api requests to the Node.js backend running on port 5002
    location /api {
        proxy_pass http://localhost:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct Route Proxies (matches development proxy config)
    # Proxies legacy/direct route requests directly to Node.js backend
    location ~ ^/(patients|appointments|labTests|vitals|prescriptions|billable-items|medical-certificates|uploads|static) {
        proxy_pass http://localhost:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (Socket.io) Support
    # Matches the /ws path used by Socket.io to establish persistent connection
    location /ws {
        proxy_pass http://localhost:5002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Custom logs
    access_log /var/log/nginx/clinic_cms_access.log;
    error_log /var/log/nginx/clinic_cms_error.log;
}

# ==============================================================================
# 🔒 SSL Setup Instructions (Let's Encrypt / Certbot)
# ==============================================================================
# Once Nginx is configured on port 80 and your domain is pointing to the VPS:
# 1. Install Certbot:
#    sudo apt install python3-certbot-nginx
#
# 2. Run Certbot to acquire SSL certificate and configure Nginx:
#    sudo certbot --nginx -d app.newlifeclinic.et
#
# 3. Certbot will automatically rewrite this file to support HTTPS, set up the Let's
#    Encrypt SSL certificate, and configure a cron job to renew it automatically.
# ==============================================================================
