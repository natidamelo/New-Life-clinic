# go2rtc configuration — New Life Clinic CCTV
# Documentation: https://github.com/AlexxIT/go2rtc
#
# go2rtc acts as a secure stream relay:
#   EZVIZ camera (RTSP) → go2rtc → browser (HLS / WebRTC)
# Camera credentials never reach the browser.
#
# Streams are added/removed dynamically by the Node.js backend via the API.
# This file only sets the server-level config.

api:
  listen: :1984
  origin: "*"
  # Uncomment and set a strong key in production:
  # key: ${GO2RTC_API_KEY}

rtsp:
  listen: :8554
  # username: ${RTSP_USERNAME}
  # password: ${RTSP_PASSWORD}

webrtc:
  listen: :8555/tcp
  candidates:
    - stun:stun.l.google.com:19302

# Camera streams — keyed by streamKey from MongoDB
# The streamKey is a UUID that the backend uses to serve HLS without exposing RTSP credentials
streams:
  # Camera 1 — Outdoor Parking (192.168.1.2)
  # EZVIZ camera streams H265 — browsers can't decode H265 in HLS.
  # FFmpeg transcodes H265→H264 on the fly so the browser can play it.
  6b8dd2bb-3e59-432e-ace3-3ffa27c64e66:
    - "ffmpeg:rtsp://admin:CWIQMH@192.168.1.2:554/Streaming/Channels/101#video=h264"

# Preload streams so they are active 24/7, eliminating connection/transcoding startup delay (4-7 seconds)
preload:
  6b8dd2bb-3e59-432e-ace3-3ffa27c64e66:


ffmpeg:
  # Timestamp overlay drawn by FFmpeg (optional — enable if you want burned-in timestamps)
  # bin: ffmpeg
  # drawtext options applied to all streams:
  # args: "-vf drawtext=fontfile=/path/to/font.ttf:text='%{localtime}':x=10:y=10:fontsize=18:fontcolor=white@0.8:box=1:boxcolor=black@0.5"

log:
  level: debug
